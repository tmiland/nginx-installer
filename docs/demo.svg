<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="demoTitle demoDesc">
  <title id="demoTitle">nginx-installer terminal demo</title>
  <desc id="demoDesc">A Debian 13 mainline install: detect the distro, install with profile full and the all module set, then show nginx version and service status.</desc>
  <rect width="960" height="500" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="959" height="499" rx="12" fill="none" stroke="#30363d"/>
  <path d="M0 42h960v-30a12 12 0 0 0-12-12H12A12 12 0 0 0 0 12z" fill="#161b22"/>
  <circle cx="22" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="21" r="6" fill="#27c93f"/>
  <text x="84" y="26" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">nginx-installer</text>
  <text x="938" y="26" text-anchor="end" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Debian 13 - nginx 1.31.9</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve">
    <text x="32" y="78" fill="#7ee787">$ <tspan fill="#79c0ff">./nginx_installer.sh --detect</tspan></text>
    <text x="32" y="100" fill="#c9d1d9">DISTRO=Debian GNU/Linux 13</text>
    <text x="32" y="122" fill="#c9d1d9">DISTRO_GROUP=Debian</text>
    <text x="32" y="166" fill="#7ee787">$ <tspan fill="#79c0ff">sudo ./nginx_installer.sh -m \</tspan></text>
    <text x="32" y="188" fill="#79c0ff">    --profile full \</text>
    <text x="32" y="210" fill="#79c0ff">    --modules "all" \</text>
    <text x="32" y="232" fill="#79c0ff">    --bad-bot</text>
    <text x="32" y="276" fill="#3fb950">[SUCCESS] Installation finished</text>
    <text x="32" y="298" fill="#3fb950">[SUCCESS] done</text>
    <text x="32" y="342" fill="#7ee787">$ <tspan fill="#79c0ff">nginx -V</tspan></text>
    <text x="32" y="364" fill="#c9d1d9">nginx version: nginx/1.31.9</text>
    <text x="32" y="386" fill="#c9d1d9">built with Nginx Installer @tmiland</text>
    <text x="32" y="430" fill="#7ee787">$ <tspan fill="#79c0ff">systemctl is-active nginx</tspan></text>
    <text x="32" y="452" fill="#3fb950">active</text>
  </g>
</svg>
